<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Byte of me — private space">
  <!-- Space layer: fully sealed. The mark is knocked out of a solid plate, so
       the silhouette alone separates this tab from the other two at 16px.
       The mask is luminance-based and therefore theme-independent; only the
       plate fill flips, which inverts plate and mark together. -->
  <style>
    .plate { fill: #0a0a0a }
    @media (prefers-color-scheme: dark) { .plate { fill: #fafafa } }
  </style>
  <mask id="space-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
    <rect width="24" height="24" fill="#fff"/>
    <path transform="translate(3.19 3.98) scale(0.71)"
          d="M3.1 20.4C2.7 18 2.5 15.9 2.5 14C2.5 6.8 8 2.2 14.2 2.2C19.4 2.2 22.3 6 22.3 10.4C22.3 15.4 18.4 18.8 13.6 18.8C9.8 18.8 7.2 16.3 7.2 13.2C7.2 10.6 9.2 8.6 11.8 8.6C13.8 8.6 15.2 10 15.2 11.8"
          fill="none" stroke="#000" stroke-width="2.9" stroke-linecap="round"/>
  </mask>
  <rect class="plate" x="1" y="1" width="22" height="22" rx="5.5"
        fill="#0a0a0a" mask="url(#space-cut)"/>
</svg>
