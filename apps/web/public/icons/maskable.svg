<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Byte of me">
  <!-- Android maskable icon. The launcher may crop this to any shape, so the
       mark is held inside the 80% safe circle (scale 0.55 of a 24 box) and the
       background runs full bleed. Background matches the manifest's
       background_color / theme_color (#0f0f1a) so the crop seam is invisible. -->
  <rect width="24" height="24" fill="#0f0f1a"/>
  <g transform="translate(5.4 5.4) scale(0.55)">
    <path transform="translate(-0.4 0.7)"
          d="M3.1 20.4C2.7 18 2.5 15.9 2.5 14C2.5 6.8 8 2.2 14.2 2.2C19.4 2.2 22.3 6 22.3 10.4C22.3 15.4 18.4 18.8 13.6 18.8C9.8 18.8 7.2 16.3 7.2 13.2C7.2 10.6 9.2 8.6 11.8 8.6C13.8 8.6 15.2 10 15.2 11.8"
          fill="none" stroke="#fafafa" stroke-width="3.6" stroke-linecap="round"/>
  </g>
</svg>
